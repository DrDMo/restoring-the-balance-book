[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restoring_the_balance"
version = "0.0.1"
description = "Code archive for the book Restoring the Balance: Authoritarian Demand and the Institutional Recovery of Democracy."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Darin Molnar" }]
keywords = ["democratic-recovery", "democratic-backsliding", "political-science", "replication", "v-dem"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# Runtime dependencies are intentionally empty at scaffold time.
# Add them as analyses are written so the lock surface stays minimal.
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "scipy>=1.12",
    "pyarrow>=15.0",
]
notebook = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/DrDMo/restoring-the-balance-book"

[tool.hatch.build.targets.wheel]
packages = ["src/restoring_the_balance"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks/**/*.ipynb_checkpoints"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
